name: test

on: [pull_request, workflow_dispatch]

jobs:
  format:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install nox
      run: uv tool install nox
    - name: Analyze
      run: nox -s format

  lint:
    name: Check Linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install nox
      run: uv tool install nox
    - name: Analyze
      run: nox -s lint

  analyze:
    name: Analyze Typing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install nox
      run: uv tool install nox
    - name: Analyze
      run: nox -s analyze

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install uv and set Python version
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Install nox
      run: uv tool install nox
    - name: Install OpenSCAD (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y openscad
    - name: Install OpenSCAD (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        choco install openscad -y
        # Prefer console launcher for CI
        $exe = (Get-Command openscad.com, openscad.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Path
        if (-not $exe) {
          $candidates = @('C:\Program Files\OpenSCAD','C:\Program Files (x86)\OpenSCAD')
          foreach ($d in $candidates) {
            if (Test-Path (Join-Path $d 'openscad.com')) { $exe = (Join-Path $d 'openscad.com'); break }
            if (Test-Path (Join-Path $d 'openscad.exe')) { $exe = (Join-Path $d 'openscad.exe'); break }
          }
        }
        if (-not $exe) { throw 'OpenSCAD not found after install' }
        $dir = Split-Path $exe -Parent
        $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "OPENSCAD_BIN=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Get-Command $exe | Format-List
        & $exe --version
    - name: Test
      run: nox -s test-${{ matrix.python-version }}

  doctest:
    name: Test Docs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install nox
      run: uv tool install nox
    - name: Analyze
      run: nox -s doctest
